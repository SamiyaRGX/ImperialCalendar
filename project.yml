name: ImperialCalendar
options:
  bundleIdPrefix: com.imperial
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES

targets:
  ImperialCalendar:
    type: application
    platform: iOS
    sources:
      - path: ImperialCalendar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imperial.calendar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "تقویم شاهنشاهی"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  ImperialCalendar:
    build:
      targets:
        ImperialCalendar: all
    archive:
      config: Release
