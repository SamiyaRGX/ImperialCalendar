name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check source files
        run: ls -R ImperialCalendar

      - name: Download Lion & Sun flag (official logo)
        run: |
          set -e
          curl -fSL -A "Mozilla/5.0" -o flag_raw.png \
            "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/State_flag_of_Iran_%281964%E2%80%931980%29.svg/3840px-State_flag_of_Iran_%281964%E2%80%931980%29.svg.png" \
          || curl -fSL -A "Mozilla/5.0" -o flag_raw.png \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/State_flag_of_Iran_%281964%E2%80%931980%29.svg/2560px-State_flag_of_Iran_%281964%E2%80%931980%29.svg.png"
          file flag_raw.png

      - name: Generate assets (AppIcon & Logo)
        run: |
          set -e
          base="ImperialCalendar/Assets.xcassets"
          mkdir -p "$base/AppIcon.appiconset" "$base/Logo.imageset"

          # آیکون اپ: مربعی با حاشیه سفید
          sips -Z 1024 flag_raw.png --out icon_sq.png >/dev/null
          sips --padToHeightWidth 1024 1024 --padColor FFFFFF icon_sq.png \
               --out "$base/AppIcon.appiconset/icon1024.png" >/dev/null

          # لوگوی داخل برنامه: پرچم کامل در سه مقیاس
          sips -Z 300 flag_raw.png --out "$base/Logo.imageset/logo.png"    >/dev/null
          sips -Z 600 flag_raw.png --out "$base/Logo.imageset/logo@2x.png" >/dev/null
          sips -Z 900 flag_raw.png --out "$base/Logo.imageset/logo@3x.png" >/dev/null

          cat > "$base/Contents.json" <<'EOF'
          { "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat > "$base/AppIcon.appiconset/Contents.json" <<'EOF'
          { "images" : [ { "filename" : "icon1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" } ], "info" : { "author" : "xcode", "version" : 1 } }
          EOF
          cat > "$base/Logo.imageset/Contents.json" <<'EOF'
          { "images" : [
              { "filename" : "logo.png",    "idiom" : "universal", "scale" : "1x" },
              { "filename" : "logo@2x.png", "idiom" : "universal", "scale" : "2x" },
              { "filename" : "logo@3x.png", "idiom" : "universal", "scale" : "3x" }
            ],
            "info" : { "author" : "xcode", "version" : 1 } }
          EOF

      - name: Generate project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ImperialCalendar.xcodeproj \
            -scheme ImperialCalendar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/App.xcarchive/Products/Applications/ImperialCalendar.app Payload/
          zip -qry ImperialCalendar-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GahshomarShahanshahi-unsigned-ipa
          path: ImperialCalendar-unsigned.ipa
